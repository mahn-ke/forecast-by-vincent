#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/forecast-by-vincent:latest@sha256:42d90b2615f6a600b7ded40da5e29dc9d770fb332a094d5d66c2863d755d26c2
    restart: on-failure:5
    environment:
      - PORT=3015
    ports:
      - "3015:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3015/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
