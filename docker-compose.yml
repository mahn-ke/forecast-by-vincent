#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/forecast-by-vincent:latest@sha256:7933b679674a1ccccf747a37c9b820088be745b247d64a0e482ea770c1282c30
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3015:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
