#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/forecast-by-vincent:latest@sha256:fa703865eef8f082722d67391f61eb95c358b59d3b1a911b9d77b2014a3e9ce1
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3015:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
