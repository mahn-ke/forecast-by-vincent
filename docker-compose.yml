#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/forecast-by-vincent:latest@sha256:067327716d73372a67b6ce4f3e8f533223010f9da006da3ebee696f85462fcde
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3015:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
