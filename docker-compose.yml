#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/forecast-by-vincent:latest@sha256:5fc87b2e75253e89c64752782d10943165607842041028deefbe20c4c62b575a
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3015:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
