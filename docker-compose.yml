#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/forecast-by-vincent:latest@sha256:1929404e4e60baf86d1cf0db2304b77ed46ba79c6b02dc98d98860daf545e276
    restart: on-failure:5
    environment:
      - PORT=3015
    ports:
      - "3015:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3015/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
