#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/forecast-by-vincent:latest@sha256:7517866b1ca56171efd0111cc230d8ff58102f7691e689350df3e2598fa027e2
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3015:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
